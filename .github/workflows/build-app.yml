# Build file APK cua app dien thoai (app/suc_khoe) moi khi code app thay doi.
# Tai APK: tab Actions tren GitHub -> chon lan chay moi nhat -> muc Artifacts -> "app-suc-khoe-apk".
name: Build app Android

on:
  push:
    branches: [main]
    paths: ["app/suc_khoe/**", ".github/workflows/build-app.yml"]
  pull_request:
    paths: ["app/suc_khoe/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/suc_khoe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-suc-khoe-apk
          path: app/suc_khoe/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

name: health_watch_app
description: App điện thoại cho thiết bị đeo tay giám sát sức khỏe người cao tuổi (gateway BLE + người nhà).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ghim đúng phiên bản: API của flutter_blue_plus thay đổi giữa các bản.
  flutter_blue_plus: 1.32.12
  http: ^1.2.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
